name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build:
    # Builds the extension and runs every test, including headless integration tests, against
    # each supported Ghidra release.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra_version: "12.0.4"
            ghidra_date: "20260303"
          - ghidra_version: "12.1.4"
            ghidra_date: "20260921"
    env:
      GHIDRA_VERSION: ${{ matrix.ghidra_version }}
      GHIDRA_DATE: ${{ matrix.ghidra_date }}

    steps:
    - uses: actions/checkout@v4
      with:
        # hatch-vcs derives the package version from tags.
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14'

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Download Ghidra
      run: |
        wget --no-verbose -O ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip
        7z x -bd ghidra.zip
        echo "GHIDRA_INSTALL_DIR=$PWD/ghidra_${GHIDRA_VERSION}_PUBLIC" >> "$GITHUB_ENV"

    - name: Build Ghidra extension
      working-directory: extension
      run: gradle buildExtension

    - name: Build Python package
      run: uv build

    - name: Python tests (including headless integration)
      run: uv run --extra headless pytest -v

    - name: Assemble release directory
      run: |
        mkdir release
        cp extension/dist/*.zip release/
        cp dist/*.whl dist/*.tar.gz release/
        cp bridge_mcp_ghidra.py release/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GhidraMCP-artifact-${{ matrix.ghidra_version }}
        path: release/*

  python-tests:
    # Fast checks without Ghidra (the integration tests skip themselves) on the oldest and
    # newest supported Python, plus installer script validation.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate installer script
        run: |
          bash -n scripts/install.sh
          scripts/install.sh --help >/dev/null
          scripts/install.sh --dry-run --no-install-deps --no-extension --no-angryghidra --prefix "$RUNNER_TEMP/triangr"
      - uses: astral-sh/setup-uv@v6
      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} pytest -v

  installer-smoke:
    # Full installer smoke test, kept separate because it downloads Ghidra and
    # builds AngryGhidra.
    runs-on: ubuntu-latest
    env:
      TRIANGR_PREFIX: /tmp/triangr
      TRIANGR_CACHE: /home/runner/.cache/triangr-ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache installer downloads and Gradle artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TRIANGR_CACHE }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: triangr-installer-${{ runner.os }}-ghidra-12.0.4-${{ hashFiles('requirements.txt', 'extension/build.gradle', 'scripts/install.sh') }}
          restore-keys: |
            triangr-installer-${{ runner.os }}-ghidra-12.0.4-

      - name: Prime Python wheelhouse
        run: |
          mkdir -p "$TRIANGR_CACHE/wheels" "$TRIANGR_CACHE/pip"
          python -m pip install --upgrade pip
          python -m pip download --prefer-binary -r requirements.txt -d "$TRIANGR_CACHE/wheels"

      - name: Run full installer
        run: |
          mkdir -p "$TRIANGR_CACHE"
          if [ -d "$TRIANGR_CACHE/tools" ]; then
            mkdir -p "$TRIANGR_PREFIX"
            cp -a "$TRIANGR_CACHE/tools" "$TRIANGR_PREFIX/tools"
          fi

          PIP_CACHE_DIR="$TRIANGR_CACHE/pip" \
          PIP_FIND_LINKS="$TRIANGR_CACHE/wheels" \
          PIP_PREFER_BINARY=1 \
            scripts/install.sh --prefix "$TRIANGR_PREFIX" --install-deps --yes --require-angryghidra-build

          rm -rf "$TRIANGR_CACHE/tools"
          mkdir -p "$TRIANGR_CACHE"
          cp -a "$TRIANGR_PREFIX/tools" "$TRIANGR_CACHE/tools"

      - name: Verify installer outputs
        run: |
          source "$TRIANGR_PREFIX/env.sh"
          test -x "$GHIDRA_HOME/ghidraRun"
          test -f "$GHIDRA_HOME/Ghidra/Extensions/GhidraMCP/lib/GhidraMCP.jar"
          test -x "$TRIANGR_PREFIX/bin/triangr-mcp"
          test -d "$GHIDRA_HOME/Ghidra/Extensions/AngryGhidra"
          "$GHIDRA_MCP_ANGR_PYTHON" -c "import angr; print(angr.__version__)"
          "$GHIDRA_MCP_ANGR_PYTHON" -c "import pyghidra"
          "$GHIDRA_MCP_ANGR_PYTHON" -m ghidra_mcp --help >/dev/null
          "$TRIANGR_PREFIX/venv/bin/bridge_mcp_ghidra" --help >/dev/null
          "$TRIANGR_PREFIX/bin/triangr-mcp" --help >/dev/null
          test -f "$ANGRYGHIDRA_SCRIPT"
