[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "ghidramcp"
dynamic = ["version"]
description = "Triangr: MCP server for Ghidra project context (GUI or headless) and optional angr/Oxidizer analysis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "LaurieWired" },
    { name = "Triangr contributors" },
]
requires-python = ">=3.10"
keywords = ["ghidra", "angr", "reverse-engineering", "mcp", "model-context-protocol"]
dependencies = [
    "mcp>=1.30,<2",
    "requests>=2.32,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

[project.optional-dependencies]
headless = ["pyghidra>=3.1"]
# angr 9.2.217 needs Python 3.12+; on older Pythons the angr tools report it as missing.
angr = ["angr==9.2.217; python_version >= '3.12'"]

[project.scripts]
ghidra-mcp = "ghidra_mcp.cli:main"
bridge_mcp_ghidra = "ghidra_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/rustopian/Triangr"
Repository = "https://github.com/rustopian/Triangr"
Issues = "https://github.com/rustopian/Triangr/issues"
Upstream = "https://github.com/LaurieWired/GhidraMCP"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
source = "vcs"
# Accept both "v1.5.1" and bare "1.5.1" style tags.
tag-pattern = "v?(?P<version>\\d+\\.\\d+(?:\\.\\d+)?)"
fallback-version = "0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ghidra_mcp",
    "tests",
    "bridge_mcp_ghidra.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ghidra: requires a Ghidra installation (GHIDRA_INSTALL_DIR)"]
